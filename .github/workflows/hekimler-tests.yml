name: Hekimler tests

on:
  workflow_dispatch:
  push:
    paths:
      - "channels/tip-ogrencileri-platformu/**"
      - ".github/workflows/hekimler-*.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: channels/tip-ogrencileri-platformu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: channels/tip-ogrencileri-platformu/requirements-runner.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-runner.txt
      - name: Hekimler unit tests (incl. TLS pin regression)
        run: python -m unittest discover -s tests -p "test_hekimler_*.py"
